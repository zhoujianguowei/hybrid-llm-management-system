<!DOCTYPE html>
<html lang="zh-CN" data-i18n-title="changepw.page_title">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link href="vendor/bootstrap-icons/1.11.3/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .lang-switch {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            gap: 4px;
            z-index: 100;
        }
        .lang-switch button {
            background: white;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            padding: 4px 10px;
            cursor: pointer;
            font-size: 13px;
            color: #666;
            transition: all 0.2s;
        }
        .lang-switch button.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }
        .container {
            background: white;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 40px;
            width: 100%;
            max-width: 420px;
        }
        .logo { text-align: center; margin-bottom: 30px; }
        .logo i { font-size: 48px; color: #667eea; }
        .logo h1 { font-size: 24px; color: #333; margin-top: 10px; }
        .logo p { color: #666; font-size: 14px; margin-top: 5px; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; color: #333; font-weight: 500; }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #667eea;
        }
        .form-group input.error { border-color: #ef4444; }
        .error-msg { color: #ef4444; font-size: 12px; margin-top: 5px; display: none; }
        .error-msg.show { display: block; }
        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.4);
        }
        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 12px 16px;
            border-radius: 4px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
        }
        .info-box i { color: #667eea; margin-right: 6px; }
    </style>
</head>
<body>
    <div class="toast" id="toast"></div>
    <div class="lang-switch">
        <button data-lang="zh" onclick="setLang('zh')">中</button>
        <button data-lang="en" onclick="setLang('en')">EN</button>
    </div>
    <div class="container">
        <div class="logo">
            <i class="bi bi-shield-lock"></i>
            <h1 data-i18n="changepw.app_name"></h1>
            <p data-i18n="changepw.app_desc"></p>
        </div>
        <div class="info-box">
            <i class="bi bi-info-circle"></i>
            <span data-i18n="changepw.info_text"></span>
        </div>
        <form id="passwordForm">
            <div class="form-group">
                <label data-i18n="changepw.new_password_label"></label>
                <input type="password" id="newPassword" placeholder="" data-i18n="changepw.new_password_placeholder" data-i18n-attr="placeholder" required oninput="validatePassword()">
                <div class="error-msg" id="newPasswordError"></div>
            </div>
            <div class="form-group">
                <label data-i18n="changepw.confirm_password_label"></label>
                <input type="password" id="confirmPassword" placeholder="" data-i18n="changepw.confirm_password_placeholder" data-i18n-attr="placeholder" required oninput="validatePassword()">
                <div class="error-msg" id="confirmError"></div>
            </div>
            <button type="submit" class="btn-submit" data-i18n="changepw.submit"></button>
        </form>
    </div>

    <link rel="stylesheet" href="common/common.css">
    <link rel="stylesheet" href="common/common-dialog.css">
    <script src="common/messages.js"></script>
    <script src="common/i18n.js"></script>
    <script src="common/common-dialog.js"></script>
    <script src="common/common-api.js"></script>
    <script>
        function updateLangButtons() {
            var current = getLang();
            document.querySelectorAll('.lang-switch button').forEach(function(btn) {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === current);
            });
        }
        window.onLangChange = function() { updateLangButtons(); applyI18n(); };

        const API_BASE = '/command';
        const STATIC_BASE = '/command/static/file';

        function getSessionId() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('sessionId') || localStorage.getItem('sessionId');
        }

        function validatePassword() {
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const newPasswordError = document.getElementById('newPasswordError');
            const confirmError = document.getElementById('confirmError');

            if (newPassword.length === 0) {
                newPasswordError.textContent = '';
                newPasswordError.classList.remove('show');
            } else if (newPassword.length < 8) {
                newPasswordError.textContent = t('changepw.password_short');
                newPasswordError.classList.add('show');
                newPasswordError.style.color = '#ef4444';
            } else if (!/^[a-zA-Z0-9]{8,}$/.test(newPassword)) {
                newPasswordError.textContent = t('changepw.password_format2');
                newPasswordError.classList.add('show');
                newPasswordError.style.color = '#ef4444';
            } else {
                newPasswordError.textContent = t('changepw.password_valid');
                newPasswordError.classList.add('show');
                newPasswordError.style.color = '#52c41a';
                setTimeout(() => {
                    newPasswordError.style.color = '#ef4444';
                    newPasswordError.classList.remove('show');
                }, 1500);
            }

            if (newPassword.length > 0 && confirmPassword.length === 0) {
                confirmError.textContent = '';
                confirmError.classList.remove('show');
            } else if (newPassword.length > 0 && confirmPassword.length > 0 && newPassword !== confirmPassword) {
                confirmError.textContent = t('changepw.password_mismatch');
                confirmError.classList.add('show');
                confirmError.style.color = '#ef4444';
            } else if (newPassword.length > 0 && confirmPassword.length > 0 && newPassword === confirmPassword) {
                confirmError.textContent = t('changepw.password_match');
                confirmError.classList.add('show');
                confirmError.style.color = '#52c41a';
                setTimeout(() => {
                    confirmError.style.color = '#ef4444';
                    confirmError.classList.remove('show');
                }, 1500);
            }
        }

        document.getElementById('passwordForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const sessionId = getSessionId();
            
            if (!newPassword) {
                document.getElementById('newPasswordError').textContent = t('changepw.password_required');
                document.getElementById('newPasswordError').classList.add('show');
                return;
            }
            
            if (newPassword.length < 8) {
                document.getElementById('newPasswordError').textContent = t('changepw.password_short');
                document.getElementById('newPasswordError').classList.add('show');
                return;
            }

            if (!/^[a-zA-Z0-9]{8,}$/.test(newPassword)) {
                document.getElementById('newPasswordError').textContent = t('changepw.password_format2');
                document.getElementById('newPasswordError').classList.add('show');
                return;
            }
            
            if (newPassword !== confirmPassword) {
                document.getElementById('confirmError').textContent = t('changepw.password_mismatch');
                document.getElementById('confirmError').classList.add('show');
                return;
            }
            
            const btn = e.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = t('changepw.submitting');
            
            try {
                const response = await fetch(API_BASE + '/file/user/force-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: 'newPassword=' + encodeURIComponent(newPassword) + 
                          '&confirmPassword=' + encodeURIComponent(confirmPassword) +
                          '&sessionId=' + encodeURIComponent(sessionId)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    localStorage.removeItem('sessionId');
                    showToast(t('changepw.success'), 'success', 1500);
                    setTimeout(function() { window.location.href = STATIC_BASE + '/login.html'; }, 1500);
                } else {
                    showToast(result.msg || t('changepw.failed'), 'error', 3000);
                    btn.disabled = false;
                    btn.textContent = t('changepw.submit');
                }
            } catch (err) {
                showToast(t('common.network_error'), 'error', 3000);
                btn.disabled = false;
                btn.textContent = t('changepw.submit');
            }
        });

        updateLangButtons();
    </script>
</body>
</html>
