    <script>
        window.onLangChange = function() {

        document.addEventListener('DOMContentLoaded', function() {
            if (typeof updateLangUI === 'function') updateLangUI();
        });
          let sessionId = localStorage.getItem('sessionId'), currentPath = '', isRootView = true, pendingDownload = null, taskPollingInterval = null, currentSort = {field:'name',asc:true}, allFiles = [], homePath = '', currentDirPerm = 0, pathPermMap = {};
        if (!sessionId) { window.location.href = STATIC_BASE + '/login.html'; }
        function escapeJs(s) { return String(s).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"'); }
        function getSessionParam() { return 'sessionId=' + encodeURIComponent(sessionId); }
        async function api(path, options) {
            try {
                return await commonApi(path, options);
            } catch (e) {
                if (e.message === 'User blocked') showBlockedCurrentUserModal();
                throw e;
            }
          }
          async function apiWithTimeout(path, options, timeoutMs = 60000) {
              const controller = new AbortController();
              const timeoutId = setTimeout(() => controller.abort(), timeoutMs);
              try {
                  options = options || {};
                  options.signal = controller.signal;
                  return await commonApi(path, options);
              } finally {
                  clearTimeout(timeoutId);
              }
          }
        function navigateToChat() { window.open(STATIC_BASE + '/openwebui/chat.html', '_blank'); }
        function showLoading(text) { document.getElementById('loadingText').textContent = text || t('common.loading'); document.getElementById('loadingOverlay').classList.add('active'); }
        function hideLoading() { document.getElementById('loadingOverlay').classList.remove('active'); }
        function toggleSidebar() {
            const sidebar = document.getElementById('sidebar');
            sidebar.classList.toggle('collapsed');
            localStorage.setItem('sidebarCollapsed', sidebar.classList.contains('collapsed'));
        }
        async function init() {
            await fetchCurrentUser();
            var currentSystem = 'linux';
            try {
                var sysResp = await fetch(API_BASE + '/system/platform', { headers: {'X-Session-Id': localStorage.getItem('sessionId')} });
                var sysData = await sysResp.json();
                if (sysData && sysData.data) currentSystem = sysData.data;
            } catch(e) {}
            const lastPath = currentUserData && currentUserData.userContext && currentUserData.userContext.fileManagerContext && currentUserData.userContext.fileManagerContext.lastVisitedFileDir ? currentUserData.userContext.fileManagerContext.lastVisitedFileDir.path : null;
            try {
                const result = await api('/file/roots');
                if (result.success) { renderRootList(result.data); }
                homePath = currentSystem === 'mac' ? '/Users/hahaha' : (currentSystem === 'linux' ? '/home' : 'C:');
            } catch (err) { console.error('Init error:', err); }
            await checkUserPermission();
            await loadUploadTasks();
            if (lastPath) {
                await navigateTo(lastPath);
            } else {
                await showRoot();
            }
            setupUploadDragDrop();
        }
        function renderRootList(roots) {
            const container = document.getElementById('rootList');
            const folderIcon = '<svg viewBox="0 0 64 64" width="20" height="20"><defs><linearGradient id="sfGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#FFD54F"/><stop offset="100%" style="stop-color:#FFB300"/></linearGradient><linearGradient id="sfTabGrad" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" style="stop-color:#FFE082"/><stop offset="100%" style="stop-color:#FFD54F"/></linearGradient></defs><g><path d="M4 16 L24 16 L28 20 L60 20 L60 52 L4 52 Z" fill="url(#sfGrad)"/><path d="M4 16 L24 16 L28 12 L56 12 L56 20 L60 20 Z" fill="url(#sfTabGrad)"/></g></svg>';
            container.innerHTML = roots.map(root => { var perm = root.filePermission || 0; var lockIcon = hasExecutePermission(perm) ? '' : '<span class="sidebar-lock-icon" title="" data-i18n="fm.toast_no_exec" data-i18n-attr="title"><i class="bi bi-lock-fill"></i></span>'; var protectedIcon = isPathProtected(perm) ? '<span class="sidebar-lock-icon" title="" data-i18n="fm.protected_path" data-i18n-attr="title"><i class="bi bi-shield-lock-fill"></i></span>' : ''; return '<div class="sidebar-item' + (!hasExecutePermission(perm) ? ' sidebar-item-locked' : '') + '" onclick="navigateToRoot(\'' + escapeJs(root.path) + '\', ' + perm + ')"><span class="icon">' + folderIcon + '</span><span class="label">' + escapeHtml(root.path) + '</span>' + protectedIcon + lockIcon + '</div>'; }).join('');
        }
        function navigateToRoot(path, perm) {
            if (!hasExecutePermission(perm)) {
                showToast(t('fm.toast_no_exec'), 'error');
                return;
            }
            currentDirPerm = perm;
            navigateTo(path, perm);
        }
        async function showRoot() {
            isRootView = true; currentPath = '';
            document.getElementById('breadcrumb').innerHTML = '<span class="breadcrumb-current">' + t('fm.my_computer') + '</span>';
            try {
                const result = await api('/file/roots');
                if (result.success) { renderRoots(result.data); } else { showToast(t('fm.toast_root_fail') + ': ' + result.msg, 'error'); }
            } catch (err) { console.error('Root directories error:', err); showToast(t('fm.toast_root_fail'), 'error'); }
        }
             function renderRoots(roots) {
            const tbody = document.getElementById('fileList'), emptyState = document.getElementById('emptyState');
            if (!roots || roots.length === 0) { tbody.innerHTML = ''; emptyState.style.display = 'block'; return; }
            emptyState.style.display = 'none';
            allFiles = roots.map(function(r) { r = Object.assign({}, r); r.name = r.path || r.name || ''; return r; });
            applySorting();
            updateUploadButtonVisibility(0);
            updateCreateFolderButtonVisibility(0);
        }
        async function navigateTo(path, perm) {
            currentPath = path; isRootView = false;
            currentDirPerm = perm !== undefined && perm !== null ? perm : (pathPermMap[path] || 0);
            updateBreadcrumb(path);
            try {
                const result = await api('/file/list?path=' + encodeURIComponent(path));
                if (result.success) {
                    allFiles = result.data;
                    applySorting();
                    if (currentDirPerm === 0) {
                        try {
                            const permResult = await api('/file/permission/check?path=' + encodeURIComponent(path));
                            if (permResult.success) currentDirPerm = permResult.data || 0;
                        } catch (e) { /* ignore */ }
                    }
                    pathPermMap[path] = currentDirPerm;
                    if (Object.keys(pathPermMap).length > 200) { var keys = Object.keys(pathPermMap); for (var ki = 0; ki < 50; ki++) delete pathPermMap[keys[ki]]; }
                    updateUploadButtonVisibility(currentDirPerm);
                    updateCreateFolderButtonVisibility(currentDirPerm);
                    return true;
                }
                else if (result.code === 404) { await showRoot(); return false; }
                else if (result.code === 403) { showToast(t('fm.toast_no_access'), 'error'); await showRoot(); return false; }
                else { showToast(t('fm.toast_list_fail') + ': ' + (result.msg || ''), 'error'); return false; }
            } catch (err) { console.error('Navigate error:', err); showToast(t('fm.toast_net_error'), 'error'); return false; }
        }
        function navigateToHome() { if (homePath) { navigateTo(homePath); } else { showToast(t('fm.toast_no_home'), 'error'); } }
        function updateBreadcrumb(path) {
            if (!path) {
                document.getElementById('breadcrumb').innerHTML = '<span class="breadcrumb-current" data-i18n="fm.my_computer"></span>';
                return;
            }
            const isWindowsPath = path.includes('\\');
            const separator = isWindowsPath ? '\\' : '/';
            const normalizedPath = isWindowsPath ? path.replace(/\\/g, '/') : path;
            const parts = normalizedPath.split('/').filter(p => p);

            let html = '<span class="breadcrumb-item" onclick="showRoot()" data-i18n="fm.my_computer"></span>', current = '';

            parts.forEach((part, index) => {
                if (index === 0 && part.match(/^[A-Za-z]:$/)) {
                    current = part + '\\';
                    var perm = pathPermMap[current] || 0;
                    html += '<span class="breadcrumb-separator">\\</span><span class="breadcrumb-item" onclick="navigateTo(\'' + escapeJs(current) + '\',' + perm + ')" title="' + part + '">' + part + '</span>';
                } else {
                    if (isWindowsPath) {
                        current = current ? current + part : part;
                        if (index < parts.length - 1) {
                            current += '\\';
                            perm = pathPermMap[current] || 0;
                            html += '<span class="breadcrumb-separator">\\</span><span class="breadcrumb-item" onclick="navigateTo(\'' + escapeJs(current) + '\',' + perm + ')" title="' + part + '">' + part + '</span>';
                        } else {
                            html += '<span class="breadcrumb-separator">\\</span><span class="breadcrumb-current" title="' + part + '">' + part + '</span>';
                        }
                    } else {
                        current += '/' + part;
                        if (index === parts.length - 1) {
                            html += '<span class="breadcrumb-separator">/</span><span class="breadcrumb-current" title="' + part + '">' + part + '</span>';
                        } else {
                            perm = pathPermMap[current] || 0;
                            html += '<span class="breadcrumb-separator">/</span><span class="breadcrumb-item" onclick="navigateTo(\'' + escapeJs(current) + '\',' + perm + ')" title="' + part + '">' + part + '</span>';
                        }
                    }
                }
            });
            document.getElementById('breadcrumb').innerHTML = html;
        }
        function applyFilters() { renderFiles(); }
        function applySorting() { renderFiles(); updateSortIndicators(); }
        function sortBy(field) {
            if (currentSort.field === field) {
                currentSort.asc = !currentSort.asc;
            } else {
                currentSort.field = field;
                currentSort.asc = true;
            }
            renderFiles();
            updateSortIndicators();
        }
        function toggleSortOrder() {
            currentSort.asc = !currentSort.asc;
            renderFiles();
            updateSortIndicators();
        }
        function updateSortIndicators() {
            const fieldNames = {name: '', size: '', time: ''};
            document.getElementById('currentSortField').textContent = fieldNames[currentSort.field] || currentSort.field;
            const sortIcon = document.querySelector('#sortOrderBtn i');
            sortIcon.className = 'bi ' + (currentSort.asc ? 'bi-sort-up' : 'bi-sort-down');
            
            ['name', 'size', 'time'].forEach(field => {
                const th = document.getElementById('col-' + field);
                const icon = document.getElementById('sort-' + field);
                if (th) {
                    th.classList.toggle('sorted', field === currentSort.field);
                }
                if (icon) {
                    icon.className = 'sort-icon bi ' + (field === currentSort.field ? (currentSort.asc ? 'bi-sort-up' : 'bi-sort-down') : 'bi-arrow-up-down');
                }
            });
        }
        function renderFiles() {
            const showHidden = document.getElementById('showHidden').checked;
            const searchText = document.getElementById('searchInput').value.trim();
            let files = allFiles.filter(f => showHidden || !f.name.startsWith('.'));
            if (searchText) {
                const searchPattern = searchText.replace(/\*/g, '.*').replace(/\?/g, '.');
                try {
                    const regex = new RegExp(searchPattern, 'i');
                    files = files.filter(f => regex.test(f.name));
                } catch (e) {
                    console.warn('Invalid search pattern:', searchText);
                }
            }
            files.sort((a, b) => {
                if (a.isDirectory && !b.isDirectory) return -1;
                if (!a.isDirectory && b.isDirectory) return 1;
                let valA, valB;
                switch (currentSort.field) {
                    case 'name': valA = a.name.toLowerCase(); valB = b.name.toLowerCase(); break;
                    case 'size': valA = a.size || 0; valB = b.size || 0; break;
                    case 'time': valA = a.lastModified || 0; valB = b.lastModified || 0; break;
                }
                if (valA < valB) return currentSort.asc ? -1 : 1;
                if (valA > valB) return currentSort.asc ? 1 : -1;
                return 0;
            });
            const emptyState = document.getElementById('emptyState');
            if (files.length === 0) {
                document.getElementById('fileList').innerHTML = '';
                document.getElementById('fileGrid').innerHTML = '';
                emptyState.style.display = 'block';
                return;
            }
            emptyState.style.display = 'none';
            if (currentView === 'grid') {
                renderGridView(files);
            } else {
                renderListView(files);
            }
        }
        function renderListView(files) {
            const tbody = document.getElementById('fileList');
            tbody.innerHTML = files.map(file => {
                const path = file.path;
                const encodedPath = encodeURIComponent(path);
                const mimeType = file.mimeType || '';
                const isDir = file.isDirectory;
                const size = file.size || 0;
                const typeClass = isDir ? 'type-directory' : 'type-file';
                return '<tr class="' + typeClass + ' type-' + file.type + '"><td><div class="file-name" data-path="' + encodedPath + '" data-mime="' + mimeType + '" data-isdir="' + isDir + '" onclick="handleFileClick(this)"><div class="icon-wrapper"><span class="file-icon">' + getFileIcon(file.type, isDir) + '</span></div><span class="name-text" title="' + file.name + '">' + file.name + '</span></div></td><td class="size-text">' + (isDir ? '-' : formatSize(size)) + '</td><td class="time-text">' + new Date(file.lastModified).toLocaleString(getLang() === 'zh' ? 'zh-CN' : 'en-US') + '</td><td><button class="action-btn action-btn-download" data-path="' + encodedPath + '" data-isdir="' + isDir + '" data-size="' + size + '" onclick="handleDownloadClick(this)"><span data-i18n="fm.perm_download"></span></button><button class="action-btn action-btn-delete" data-path="' + encodedPath + '" data-isdir="' + isDir + '" onclick="handleDeleteClick(this)"><span data-i18n="fm.perm_delete"></span></button></td></tr>';
            }).join('');
            if (typeof applyI18n === 'function') applyI18n();
        }
        function renderGridView(files) {
            const grid = document.getElementById('fileGrid');
            grid.innerHTML = files.map(file => {
                const path = file.path;
                const encodedPath = encodeURIComponent(path);
                const mimeType = file.mimeType || '';
                const isDir = file.isDirectory;
                const size = file.size || 0;
                const typeClass = isDir ? 'type-directory' : 'type-file';
                const sizeText = isDir ? '' : formatSize(size);
                const timeText = new Date(file.lastModified).toLocaleString(getLang() === 'zh' ? 'zh-CN' : 'en-US');
                return '<div class="file-card ' + typeClass + ' type-' + file.type + '" data-path="' + encodedPath + '" data-mime="' + mimeType + '" data-isdir="' + isDir + '" data-size="' + size + '" onclick="handleGridClick(this)"><div class="card-actions"><button class="card-action-btn download" onclick="event.stopPropagation();handleGridActionBtn(event,\'download\')"><i class="bi bi-download"></i></button><button class="card-action-btn delete" onclick="event.stopPropagation();handleGridActionBtn(event,\'delete\')"><i class="bi bi-trash3"></i></button></div><div class="card-icon-area"><div class="icon-wrapper"><span class="file-icon">' + getFileIcon(file.type, isDir) + '</span></div></div><div class="card-info"><div class="card-name" title="' + file.name + '">' + file.name + '</div><div class="card-meta"><span>' + sizeText + '</span><span>' + timeText + '</span></div></div></div>';
            }).join('');
            if (typeof applyI18n === 'function') applyI18n();
        }
        function handleGridActionBtn(event, action) {
            const card = event.target.closest('.file-card');
            const path = decodeURIComponent(card.dataset.path);
            const isDir = card.dataset.isdir === 'true';
            const size = parseInt(card.dataset.size) || 0;
            if (action === 'download') {
                handleDownload(path, isDir, size);
            } else if (action === 'delete') {
                const name = path.split('/').pop() || path.split('\\').pop();
                pendingDelete = {path, isDir};
                const msg = t(isDir ? 'fm.confirm_delete_dir' : 'fm.confirm_delete_file', {name: name});
                document.getElementById('deleteConfirmMsg').textContent = msg;
                document.getElementById('directoryWarning').style.display = isDir ? 'block' : 'none';
                document.getElementById('deleteConfirmBtn').classList.toggle('delete-directory', isDir);
                document.getElementById('deleteConfirmModal').classList.add('active');
            }
        }
        function handleGridClick(element) {
            const path = decodeURIComponent(element.dataset.path);
            const mimeType = element.dataset.mime;
            const isDir = element.dataset.isdir === 'true';
            const perm = parseInt(element.dataset.perm) || 0;
            if (isDir && !hasExecutePermission(perm)) {
                showToast(t('fm.toast_no_access'), 'error');
                return;
            }
            if (isDir) {
                currentDirPerm = perm;
                navigateTo(path, perm);
            } else {
                if (!isPreviewable(mimeType)) {
                    showAlert(t('fm.toast_preview_fail'));
                } else {
                    previewFile(path, mimeType);
                }
            }

        let currentView = localStorage.getItem('fileManagerView') || 'list';

            currentView = view;

            document.getElementById('viewGridBtn').classList.toggle('active', view === 'grid');

            const grid = document.getElementById('fileGrid');
            if (view === 'grid') {
                tableContainer.style.display = 'none';
                grid.classList.add('active');

                tableContainer.style.display = 'block';
                grid.classList.remove('active');

            renderFiles();

        setTimeout(() => setView(currentView), 150);
        function handleSearch() {
            const searchInput = document.getElementById('searchInput');
            const searchBox = document.getElementById('searchBox');

                searchBox.classList.add('has-text');

                searchBox.classList.remove('has-text');

        function handleSearchKeydown(event) {

            if (mimeType.startsWith('video/') || mimeType === 'video/x-matroska') return true;
            if (mimeType.startsWith('text/') || mimeType === 'application/json' || mimeType === 'application/javascript' || mimeType === 'application/xml' || mimeType === 'text/markdown') return true;

        function previewFile(path, mimeType) {

            const encodedPath = encodeURIComponent(path);
            const previewUrl = API_BASE + '/file/preview?path=' + encodedPath + '&' + getSessionParam();
            fullscreenBtn.style.display = 'flex';
            if (mimeType.startsWith('image/')) {
                content.innerHTML = '<img src="' + previewUrl + '" class="preview-image" onclick="closePreview()" onerror="showImageError()">';
            } else if (mimeType.startsWith('video/')) {
                content.innerHTML = '';
                const video = document.createElement('video');
                video.controls = true;
                video.className = 'preview-media';
                video.preload = 'metadata';
                video.autoplay = true;
                video.id = 'previewVideoElement';
                video.appendChild(document.createTextNode(''));
                video.dataset.errorHandled = 'false';
                video.onerror = function() {
                    if (video.dataset.errorHandled === 'false') {
                        video.dataset.errorHandled = 'true';
                        showVideoError(mimeType);
                    }
                };
                video.src = previewUrl;
                content.appendChild(video);
                modal.classList.add('active');
                video.play().catch(function() {});
                return;
            } else if (mimeType.startsWith('audio/')) {
                content.innerHTML = '<audio controls autoplay id="previewAudioElement" style="width:100%;max-width:500px" onerror="showAudioError()"><source src="' + previewUrl + '" type="' + mimeType + '" data-i18n="fm.toast_audio_nosupport"></audio>';
            } else if (mimeType === 'application/pdf') {
                content.innerHTML = '<embed src="' + previewUrl + '#toolbar=0&navpanes=0" type="application/pdf" class="preview-pdf" onerror="showPdfError()">';
            } else if (mimeType.startsWith('text/') || mimeType === 'application/json' || mimeType === 'application/javascript' || mimeType === 'application/xml' || mimeType === 'text/markdown') {
                fetchTextPreview(previewUrl);

        let lastTaskUpdateTime = 0;

        async function updateTasks() {
            const now = Date.now();

            try {
                const result = await api('/file/task/list');
                if (result.success) {

        let previousTaskStatus = {};
        let firstTaskCheck = true;
        function checkTaskCompletion(tasks) {
            if (!tasks) return;
            cleanOldCompletedTasks();
            const completedTasks = getCompletedTasks();
            
            tasks.forEach(task => {
                const taskId = task.taskId;
                const currentStatus = task.status;
                const previousStatus = previousTaskStatus[taskId];

                if (firstTaskCheck) {
                    if (currentStatus === 'COMPLETED') {
                        completedTasks[taskId] = Date.now();
                        saveCompletedTasks(completedTasks);
                    }
                } else if (currentStatus === 'COMPLETED' && previousStatus !== 'COMPLETED' && !completedTasks[taskId]) {
                    completedTasks[taskId] = Date.now();
                    saveCompletedTasks(completedTasks);
                }

                previousTaskStatus[taskId] = currentStatus;
            });
            firstTaskCheck = false;
        }
        function getCompletedTasks() {

        function cleanOldCompletedTasks() {
            const tasks = getCompletedTasks();
            const now = Date.now();
            const oneDay = 24 * 60 * 60 * 1000;
            const newTasks = {};
            for (const taskId in tasks) {
                if (now - tasks[taskId] < oneDay) {
                    newTasks[taskId] = tasks[taskId];
                }
            }
            saveCompletedTasks(newTasks);

            for (const node of container.querySelectorAll('.task-item')) {
                if (node.dataset.taskId) existing.set(node.dataset.taskId, node);

            let html = '';
            for (let i = 0; i < limit; i++) {
                const task = tasks[i];
                let statusHtml = '';
                if (task.status === 'PENDING' || task.status === 'PROCESSING') { statusHtml = '<span class="loading"></span> <span data-i18n="fm.processing"></span>'; }
                      else if (task.status === 'COMPLETED') { statusHtml = '<a href="' + API_BASE + '/file/download/directory?taskId=' + task.taskId + '&' + getSessionParam() + '" target="_blank" class="task-status completed" data-i18n="fm.click_download"></a>'; }

                const fileNameEsc = String(task.fileName || '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
                html += '<div class="task-item" data-task-id="' + task.taskId + '"><div class="task-name" title="' + fileNameEsc + '">' + fileNameEsc + '</div><div class="task-status">' + statusHtml + '</div></div>';

                if (canDownload) actions += '<button class="action-btn action-btn-download" data-path="' + encodedPath + '" data-isdir="' + isDir + '" data-size="' + size + '" onclick="handleDownloadClick(this)"><span data-i18n="fm.perm_download"></span></button>';
                if (canDelete) actions += '<button class="action-btn action-btn-delete" data-path="' + encodedPath + '" data-isdir="' + isDir + '" onclick="handleDeleteClick(this)"><span data-i18n="fm.perm_delete"></span></button>';
                return '<tr class="' + typeClass + ' type-' + file.type + '"><td><div class="file-name" data-path="' + encodedPath + '" data-mime="' + mimeType + '" data-isdir="' + isDir + '" data-perm="' + perm + '" onclick="handleFileClick(this)"><div class="icon-wrapper"><span class="file-icon">' + getFileIcon(file.type, isDir) + '</span></div><span class="name-text" title="' + file.name + '">' + file.name + '</span></div></td><td class="size-text">' + (isDir ? '-' : formatSize(size)) + '</td><td class="time-text">' + new Date(file.lastModified).toLocaleString(getLang() === 'zh' ? 'zh-CN' : 'en-US') + '</td><td>' + actions + '</td></tr>';
            }).join('');
            if (typeof applyI18n === 'function') applyI18n();
        };

        // === Override renderGridView to show permission icons ===
        const origRenderGridView = renderGridView;
        renderGridView = function(files) {
            const grid = document.getElementById('fileGrid');
            grid.innerHTML = files.map(file => {
                const path = file.path;
                const encodedPath = encodeURIComponent(path);
                const mimeType = file.mimeType || '';
                const isDir = file.isDirectory;
                const size = file.size || 0;
                const typeClass = isDir ? 'type-directory' : 'type-file';
                const sizeText = isDir ? '' : formatSize(size);
                const timeText = new Date(file.lastModified).toLocaleString(getLang() === 'zh' ? 'zh-CN' : 'en-US');
                const perm = file.filePermission || 0;
                const canDownload = hasDownloadPermission(perm);
                const isItemProtected = (perm & 0x0400) !== 0;
                const canDelete = !isItemProtected && hasDeletePermission(perm);
                var cardActions = '';
                if (canDownload) cardActions += '<button class="card-action-btn download" onclick="event.stopPropagation();handleGridActionBtn(event,\'download\')"><i class="bi bi-download"></i></button>';
                if (canDelete) cardActions += '<button class="card-action-btn delete" onclick="event.stopPropagation();handleGridActionBtn(event,\'delete\')"><i class="bi bi-trash3"></i></button>';
                return '<div class="file-card ' + typeClass + ' type-' + file.type + '" data-path="' + encodedPath + '" data-mime="' + mimeType + '" data-isdir="' + isDir + '" data-size="' + size + '" data-perm="' + (file.filePermission || 0) + '" onclick="handleGridClick(this)"><div class="card-actions">' + cardActions + '</div><div class="card-icon-area"><div class="icon-wrapper"><span class="file-icon">' + getFileIcon(file.type, isDir) + '</span></div></div><div class="card-info"><div class="card-name" title="' + file.name + '">' + file.name + '</div><div class="card-meta"><span>' + sizeText + '</span><span>' + timeText + '</span></div></div></div>';
            }).join('');
            if (typeof applyI18n === 'function') applyI18n();
        };

       // === Enhanced handlers ===
        async function handleDownload(path, isDirectory, size) {
            if (isDirectory) {
                try {
                    const result = await api('/file/create/download_task', { method: 'POST', body: 'path=' + encodeURIComponent(path) });
                    if (result.success) { showToast(t('fm.toast_dl_task_created'), 'success'); }
                    else { showToast(t('fm.toast_dl_task_fail') + ': ' + (result.msg || ''), 'error'); }
                } catch (err) { console.error('Download error:', err); showToast(t('fm.toast_dl_task_fail') + ': ' + (err.message || ''), 'error'); }
            } else if (size > 1024 * 1024 * 1024) {
                pendingDownload = path;
                document.getElementById('confirmMsg').textContent = t('fm.confirm_download_msg');
                document.getElementById('confirmModal').classList.add('active');
            } else {
                directDownload(path);
            }
        }

     function confirmDownload() {
            document.getElementById('confirmModal').classList.remove('active');
            if (pendingDownload) {
                directDownload(pendingDownload);
                pendingDownload = null;
            }
        }

        async function confirmDelete() {
            document.getElementById('deleteConfirmModal').classList.remove('active');
            if (!pendingDelete) return;
            const { path } = pendingDelete;
            pendingDelete = null;
            await executeDelete(path);
        }
        async function executeDelete(path) {
            document.getElementById('deleteProgressModal').classList.add('active');
            try {
                const result = await apiWithTimeout('/file/delete', { method: 'POST', body: 'path=' + encodeURIComponent(path) }, 60000);
                closeDeleteProgressModal();
                if (result.success) {
                    // 本地移除已删除项并立即重绘，避免重新拉取列表导致页面闪烁
                    const index = allFiles.findIndex(f => f.path === path);
                    if (index !== -1) {
                        allFiles.splice(index, 1);
                        renderFiles();
                    } else if (isRootView) {
                        showRoot();
                    } else {
                        navigateTo(currentPath, currentDirPerm);
                    }
                } else {
                    showToast(result.msg || t('fm.toast_delete_fail'), 'error');
                }
            } catch (err) {
                closeDeleteProgressModal();
                console.error('Delete error:', err);
                if (err.name === 'AbortError') {
                    showToast(t('fm.delete_timeout'), 'error');
                } else {
                    showToast(err.message || t('fm.toast_delete_fail'), 'error');
                }
            }
        }
        function closeDeleteProgressModal() {
            document.getElementById('deleteProgressModal').classList.remove('active');
        }

        checkUserPermission();
        init();
    </script>
</body>
</html>
